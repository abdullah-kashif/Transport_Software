<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTLS Transport - Completed Truck Summary</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
</head>
<body data-page="completed-truck-summary">
  <div class="app">
    <div class="mobile-topbar"><button class="nav-toggle" type="button" data-nav-toggle aria-label="Open navigation">&#9776;</button><strong>GTLS Transport</strong></div>
    <div class="nav-overlay" data-nav-overlay></div>
    <aside class="sidebar">
      <div class="sidebar-mobile-head"><strong>Menu</strong><button class="nav-close" type="button" data-nav-close aria-label="Close navigation">&times;</button></div>
      <div class="brand"><h1>GTLS Transport</h1></div>
      <nav class="nav">
        <a href="dashboard.html" data-page="dashboard">Dashboard</a><a href="booking.html" data-page="booking">Booking Form</a><a href="ledger.html" data-page="ledger">Booking Summary</a><a href="truck.html" data-page="truck">Truck Details</a><a href="truck-summary.html" data-page="truck-summary">Pending Truck Summary</a><a href="completed-truck-summary.html" data-page="completed-truck-summary">Completed Truck Summary</a><a href="employees.html" data-page="employee">Employees</a><a href="khata.html" data-page="khata">Khata Page</a><a href="admin-login.html" data-page="admin-login">Admin</a>
      </nav><div class="tip"></div>
    </aside>
    <main class="main">
      <section class="hero"><h2>Completed Truck Summary</h2></section>
      <section class="screen">
        <div class="screen-head">
          <div></div>
          <div class="ledger-filter">
            <div class="ledger-filter-control"><label for="completed-truck-start-date">Start Date</label><input id="completed-truck-start-date" type="date" data-truck-summary-start-date /></div>
            <div class="ledger-filter-control"><label for="completed-truck-end-date">End Date</label><input id="completed-truck-end-date" type="date" data-truck-summary-end-date /></div>
            <div class="ledger-total" aria-live="polite"><span>Total Trucks</span><strong data-truck-summary-total-trucks>0</strong></div>
            <div class="ledger-total" aria-live="polite"><span>Total Work Amount</span><strong data-completed-total-work>PKR 0</strong></div>
            <div class="ledger-filter-control"><label for="truck-summary-customer-filter">Truck No</label><select id="truck-summary-customer-filter" data-truck-summary-customer-filter><option value="">All Trucks</option></select></div>
            <div class="ledger-filter-control"><label for="truck-summary-job-sort">Job Order</label><select id="truck-summary-job-sort" data-truck-summary-job-sort><option value="desc">Descending (Highest First)</option><option value="asc">Ascending (Lowest First)</option></select></div>
            <span class="ledger-count" data-truck-summary-count>0 job(s)</span>
          </div>
        </div>
        <div class="truck-summary-groups" data-truck-summary-groups></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
