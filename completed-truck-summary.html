<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTLS Transport - Completed Truck Summary</title>
  <link rel="stylesheet" href="styles.css?v=20260811-17" />
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
</head>
<body data-page="completed-truck-summary">
  <div class="app">
    <div class="mobile-topbar"><button class="nav-toggle" type="button" data-nav-toggle aria-label="Open navigation">&#9776;</button><strong>GTLS Transport</strong></div>
    <div class="nav-overlay" data-nav-overlay></div>
    <aside class="sidebar">
      <div class="sidebar-mobile-head"><strong>Menu</strong><button class="nav-close" type="button" data-nav-close aria-label="Close navigation">&times;</button></div>
      <div class="brand"><h1>GTLS Transport</h1></div>
      <nav class="nav">
        <a href="dashboard.html" data-page="dashboard">Dashboard</a><a href="booking.html" data-page="booking">Booking Form</a><a href="ledger.html" data-page="ledger">Booking Summary</a><a href="truck.html" data-page="truck">Truck Details</a><a href="truck-summary.html" data-page="truck-summary">Pending Truck Summary</a><a href="completed-truck-summary.html" data-page="completed-truck-summary">Completed Truck Summary</a><a href="employees.html" data-page="employee">Employees</a><a href="khata.html" data-page="khata">Accounts Receivable</a><a href="accounts-payable.html" data-page="accounts-payable">Accounts Payable</a><a href="admin.html" data-page="admin">Admin</a>
      </nav><div class="tip"></div>
    </aside>
    <main class="main">
      <section class="hero dashboard-hero">
        <h2>Completed Truck Summary</h2>
        <div class="notification-center" data-payment-notifications>
          <button class="notification-trigger" type="button" data-notification-trigger aria-label="Open payment notifications" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
              <path d="M10 21h4"></path>
            </svg>
            <span class="notification-badge" data-notification-count hidden>0</span>
          </button>
          <div class="notification-panel" data-notification-panel hidden>
            <div class="notification-panel-head">
              <div>
                <strong>Payment Alerts</strong>
                <span data-notification-summary>No expired payments</span>
              </div>
              <button class="notification-close" type="button" data-notification-close aria-label="Close notifications">&times;</button>
            </div>
            <div class="notification-list" data-notification-list></div>
          </div>
        </div>
      </section>
      <section class="screen">
        <div class="screen-head truck-summary-screen-head">
          <div class="truck-summary-stats">
            <div class="ledger-total ledger-total-trucks" aria-live="polite"><span>Total Trucks</span><strong data-truck-summary-total-trucks>0</strong></div>
            <div class="ledger-total" aria-live="polite"><span>P&amp;L</span><strong data-completed-profit-loss>PKR 0</strong></div>
            <div class="ledger-total" aria-live="polite"><span>Total Work Amount</span><strong data-completed-total-work>PKR 0</strong></div>
          </div>
          <div class="truck-summary-controls">
            <div class="ledger-filter-control"><label for="truck-summary-customer-filter">Truck No</label><select id="truck-summary-customer-filter" data-truck-summary-customer-filter><option value="">All Trucks</option></select></div>
            <div class="ledger-filter-control"><label for="completed-truck-start-date">Start Date</label><input id="completed-truck-start-date" type="date" data-truck-summary-start-date /></div>
            <div class="ledger-filter-control"><label for="completed-truck-end-date">End Date</label><input id="completed-truck-end-date" type="date" data-truck-summary-end-date /></div>
            <div class="ledger-filter-control"><label for="truck-summary-job-sort">Job Order</label><select id="truck-summary-job-sort" data-truck-summary-job-sort><option value="desc">Descend</option><option value="asc">Ascend</option></select></div>
          </div>
        </div>
        <div class="truck-summary-download">
          <span class="ledger-count" data-truck-summary-count>0 job(s)</span>
          <div class="truck-summary-download-actions">
            <button type="button" class="clear-filter-btn" data-truck-summary-reset-filters title="Reset all filters">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              Clear Filters
            </button>
          </div>
        </div>
        <div class="truck-summary-groups" data-truck-summary-groups></div>
      </section>
    </main>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js?v=20260811-17"></script>
</body>
</html>
