<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTLS Transport - Admin Sign In</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="admin-login">
  <div class="app">
    <div class="mobile-topbar">
      <button class="nav-toggle" type="button" data-nav-toggle aria-label="Open navigation">&#9776;</button>
      <strong>GTLS Transport</strong>
    </div>
    <div class="nav-overlay" data-nav-overlay></div>
    <aside class="sidebar">
      <div class="sidebar-mobile-head">
        <strong>Menu</strong>
        <button class="nav-close" type="button" data-nav-close aria-label="Close navigation">&times;</button>
      </div>
      <div class="brand">
        <h1>GTLS Transport</h1>
      </div>
      <nav class="nav">
        <a href="dashboard.html" data-page="dashboard">Dashboard</a>
        <a href="booking.html" data-page="booking">Booking Form</a>
        <a href="ledger.html" data-page="ledger">Booking Summary</a>
        <a href="truck.html" data-page="truck">Truck Details</a>
        <a href="truck-summary.html" data-page="truck-summary">Truck Summary</a>
        <a href="employees.html" data-page="employee">Employees</a>
        <a href="khata.html" data-page="khata">Khata Page</a>
        <a href="admin-login.html" data-page="admin-login">Admin</a>
      </nav>
      <div class="tip"></div>
    </aside>

    <main class="main">
      <section class="screen">
        <div class="screen-head">
          <div>
            <h3>Admin Sign In</h3>
          </div>
        </div>
        <form data-admin-login-form class="form-grid">
          <div class="field"><label>Email</label><input name="email" type="email" placeholder="Enter admin email" required /></div>
          <div class="field">
            <label>Password</label>
            <div class="password-input-group">
              <input name="password" type="password" placeholder="Enter password" required />
              <button class="password-toggle" type="button" data-password-toggle aria-label="Show password" title="Show password"></button>
            </div>
          </div>
          <div class="field full actions">
            <button class="btn primary" type="submit">Sign In</button>
          </div>
        </form>
        <div class="notice" data-notice hidden></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
