<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gtlsNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b365d" />
      <stop offset="100%" stop-color="#0a1626" />
    </linearGradient>
    <linearGradient id="gtlsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  
  <!-- Base Squircle -->
  <rect width="64" height="64" rx="15" fill="url(#gtlsNavy)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="url(#gtlsOrange)" stroke-width="2.5" stroke-opacity="0.9" />

  <!-- Freight Container Body -->
  <rect x="8" y="16" width="30" height="25" rx="3" fill="url(#metal)" />
  <!-- Container Roof Cap -->
  <rect x="8" y="16" width="30" height="4" rx="1" fill="#cbd5e1" />
  <!-- Container Vertical Ribs -->
  <rect x="15" y="20" width="2.5" height="19" rx="1" fill="#94a3b8" />
  <rect x="22" y="20" width="2.5" height="19" rx="1" fill="#94a3b8" />
  <rect x="29" y="20" width="2.5" height="19" rx="1" fill="#94a3b8" />

  <!-- Truck Cab Body -->
  <path d="M38 23 L47 23 L54 31 L55 41 L38 41 Z" fill="url(#gtlsOrange)" />
  <!-- Cab Windshield Glass -->
  <path d="M46 25 L40 25 L40 32 L51 32 Z" fill="#0f172a" />
  <!-- Headlight -->
  <rect x="52.5" y="36.5" width="3" height="3" rx="1" fill="#ffffff" />
  
  <!-- Lower Chassis / Mudguard Rail -->
  <rect x="9" y="41" width="45" height="3" rx="1.5" fill="#334155" />
  
  <!-- Wheels with Rims -->
  <!-- Rear Wheels -->
  <circle cx="16" cy="46" r="6" fill="#0f172a" />
  <circle cx="16" cy="46" r="3" fill="#f59e0b" />
  <circle cx="28" cy="46" r="6" fill="#0f172a" />
  <circle cx="28" cy="46" r="3" fill="#f59e0b" />
  <!-- Front Wheel -->
  <circle cx="48" cy="46" r="6" fill="#0f172a" />
  <circle cx="48" cy="46" r="3" fill="#f59e0b" />

  <!-- Speed / Motion Accents -->
  <path d="M4 22 L6.5 22 M2 28 L6 28 M4 34 L6.5 34" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
</svg>
