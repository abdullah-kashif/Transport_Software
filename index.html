<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTLS Transport - Sign In</title>
  <link rel="stylesheet" href="styles.css?v=20260811-17" />
</head>
<body data-page="signin" class="auth-page">
  <main class="auth-shell">
    <section class="auth-stage">
      <div class="auth-frame">
        <div class="auth-visual" aria-hidden="true">
          <div class="auth-visual-glow"></div>
        </div>
        <div class="auth-panel">
          <div class="auth-card">
            <div class="auth-brand">
              <strong>Sign In</strong>
            </div>
            <form data-software-login-form class="form-grid auth-form">
              <div class="field full">
                <label>Email</label>
                <input name="email" type="email" placeholder="Email or username" required />
              </div>
              <div class="field full">
                <label>Password</label>
                <div class="password-input-group">
                  <input name="password" type="password" placeholder="Enter password" required />
                  <button class="password-toggle" type="button" data-password-toggle aria-label="Show password" title="Show password"></button>
                </div>
              </div>
              <div class="field full actions">
                <button class="btn primary auth-submit" type="submit">Sign in</button>
              </div>
            </form>
            <div class="notice" data-notice hidden></div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js?v=20260811-17"></script>
</body>
</html>
