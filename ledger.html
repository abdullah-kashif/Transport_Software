<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTLS Transport - Summary Page</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="ledger">
  <div class="app">
    <div class="mobile-topbar">
      <button class="nav-toggle" type="button" data-nav-toggle aria-label="Open navigation">&#9776;</button>
      <strong>GTLS Transport</strong>
    </div>
    <div class="nav-overlay" data-nav-overlay></div>
    <aside class="sidebar">
      <div class="sidebar-mobile-head">
        <strong>Menu</strong>
        <button class="nav-close" type="button" data-nav-close aria-label="Close navigation">&times;</button>
      </div>
      <div class="brand">
        <h1>GTLS Transport</h1>
      </div>
      <nav class="nav">
        <a href="dashboard.html" data-page="dashboard">Dashboard</a>
        <a href="booking.html" data-page="booking">Booking Form</a>
        <a href="ledger.html" data-page="ledger">Summary Page</a>
        <a href="truck.html" data-page="truck">Truck Details</a>
        <a href="employees.html" data-page="employee">Employees</a>
        <a href="khata.html" data-page="khata">Khata Page</a>
        <a href="admin-login.html" data-page="admin-login">Admin</a>
      </nav>
      <div class="tip"></div>
    </aside>

    <main class="main">
      <section class="hero">
        <h2>Summary Page</h2>
      </section>
      <section class="screen">
        <div class="screen-head">
          <div>
            <h3>Customer Summary</h3>
          </div>
          <div class="ledger-filter">
            <div class="ledger-filter-control">
              <label for="summary-customer-filter">Customer</label>
              <select id="summary-customer-filter" data-summary-customer-filter>
                <option value="">All Customers</option>
              </select>
            </div>
            <span class="ledger-count" data-summary-count>0 customer(s)</span>
          </div>
        </div>
        <div class="table-wrap">
          <table class="statement-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Customer</th>
                <th>Receivable Amount</th>
              </tr>
            </thead>
            <tbody data-ledger-rows></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
